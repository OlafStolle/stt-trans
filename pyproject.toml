[project]
name = "blitztext-linux"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.30",
    "evdev>=1.7",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "python-dotenv>=1.0",
    "aiofiles>=23.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
